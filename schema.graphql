type GlobalState @entity {
  id: ID!
  oracles: [Oracle!]! @derivedFrom(field: "state")
  activeOracles: [Oracle!]!
  subgraphStates: [SubgraphState!]! @derivedFrom(field: "globalState")
}

type Oracle @entity {
  id: Bytes! # address
  index: String! # oracle_index
  state: GlobalState!
  latestConfig: OracleConfiguration!
  configurations: [OracleConfiguration!]! @derivedFrom(field: "oracle")
  votes: [OracleVote!]! @derivedFrom(field: "oracle")
  active: Boolean!
  activeSince: BigInt!
  activeUntil: BigInt! # 0 means active
}

type OracleVote @entity(immutable: true) {
  id: ID!
  oracle: Oracle!
  subgraphState: SubgraphState!
  subgraphDeploymentID: Bytes! # bytes32
  deny: Boolean! # bool
  timestamp: BigInt! # uint256
}

type OracleConfiguration @entity(immutable: true) {
  id: ID!
  oracle: Oracle!
  version: String!
  ipfsConcurrency: String!
  ipfsTimeout: String!
  minSignal: String!
  period: String!
  gracePeriod: String!
  supportedDataSourceKinds: String!
  networkSubgraphDeploymentId: String!
  epochBlockOracleSubgraphDeploymentId: String!
  subgraphAvailabilityManagerContract: String!
  oracleIndex: String!
  createdAt: BigInt!
}

type SubgraphState @entity {
  id: Bytes! # subgraphDeploymentID
  globalState: GlobalState!
  currentVotes: [OracleVote!]! @derivedFrom(field: "subgraphState")
  rewardsDenyLog: [RewardsDenyLog!]! @derivedFrom(field: "subgraphState") # If empty subgraph was never denylisted
  lastUpdated: BigInt!
}

type RewardsDenyLog @entity(immutable: true) {
  id: Bytes!
  deny: Boolean!
  subgraphDeploymentID: Bytes! # bytes32
  subgraphState: SubgraphState!
  timestamp: BigInt!
}
