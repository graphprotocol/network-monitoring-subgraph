specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SubgraphAvailabilityManager
    network: arbitrum-one
    source:
      abi: SubgraphAvailabilityManager
      address: "0x1cB555359319A94280aCf85372Ac2323AaE2f5fd"
      startBlock: 223974980
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - NewOwnership
        - NewPendingOwnership
        - OracleSet
        - OracleVote
        - VoteTimeLimitSet
      abis:
        - name: SubgraphAvailabilityManager
          file: ./abis/SubgraphAvailabilityManager.json
      eventHandlers:
        - event: OracleSet(indexed uint256,indexed address)
          handler: handleOracleSet
        - event: OracleVote(indexed bytes32,bool,indexed uint256,uint256)
          handler: handleOracleVote
      file: ./src/subgraph-availability-manager.ts
  - kind: ethereum
    name: SAODataEdge
    network: arbitrum-one
    source:
      abi: SAODataEdge
      address: "0xeD16cEbd4fa74a0016E1149cc03563Db4B223aec"
      startBlock: 223927924
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Log
      abis:
        - name: SAODataEdge
          file: ./abis/SAODataEdge.json
      eventHandlers:
        - event: Log(bytes)
          handler: handleLog
      file: ./src/sao-data-edge.ts
  - kind: ethereum
    name: RewardsManager
    network: arbitrum-one
    source:
      address: "0x971B9d3d0Ae3ECa029CAB5eA1fB0F72c85e6a525"
      abi: RewardsManager
      startBlock: 42449638
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ContractSynced
        - ParameterUpdated
        - RewardsAssigned
        - RewardsDenied
        - RewardsDenylistUpdated
        - SetController
      abis:
        - name: RewardsManager
          file: ./abis/RewardsManager.json
      eventHandlers:
        - event: RewardsDenylistUpdated(indexed bytes32,uint256)
          handler: handleRewardsDenylistUpdated
      file: ./src/rewards-manager.ts
